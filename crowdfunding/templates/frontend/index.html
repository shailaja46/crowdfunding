<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crowdfunding</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { font-family: Arial, sans-serif; background:#b8cff0; }
.navbar-dark { background: linear-gradient(90deg,#3b13ea,#705ff3); }
.hero { background: linear-gradient(90deg,#1168a2,#6451f6); color:#e2c8f8; padding:50px; border-radius:8px; margin-bottom:20px;}
.campaign-img { height:180px; object-fit:cover; width:100%; }
.btn-cta { background:#27ae60; border:none; color:#fff; }
.btn-cta:hover { background:#1f8a4c; }
.small-muted { color:#062f80; }
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">

<a class="navbar-brand" href="/">🌍CROWDFUNDING</a>

<div class="ms-auto d-flex align-items-center gap-2">

</div>
</div>
</nav>

<div class="container mt-4">

<div class="hero">
<div class="row align-items-center">

<div class="col-md-8">
<h1>Fund real projects. Change real lives.</h1>

<p class="small-muted">
Create campaigns, collect donations, and track progress — all in one place.
</p>

<div class="mt-3">
<button class="btn btn-outline-light btn-lg" onclick="loadCampaigns()">Browse Campaigns</button>
</div>
</div>
<div class="col-md-4 d-none d-md-block">
<div class="card p-3" style="background:rgba(215, 248, 246, 0.923); border:none;">
<h6 class="text-muted">Active campaigns</h6>
<h2 id="statCount">0</h2>
<p class="small-muted">Launch your idea and get support.</p>
</div>
</div>
</div>
</div>
<div id="mainArea">
<h5 class="mb-3">Active Campaigns</h5>
<div id="grid" class="row g-3"></div>
</div>
</div>

<div id="campaignModalContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

const API_BASE = "http://127.0.0.1:8000/api/";
let currentUser = localStorage.getItem('currentUser') || null;

function escapeHtml(s){
if(!s) return '';
return s.replace(/[&<>"'=\/]/g,function(c){
return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','=':'&#x3D;'}[c];
});
}

async function loadCampaigns(){

try{

const res=await fetch(API_BASE+"campaigns/");
const data=await res.json();

renderGrid(data);
document.getElementById('statCount').innerText=data.length;

}

catch(err){

console.error(err);
document.getElementById('grid').innerHTML=
'<div class="col-12">Cannot load campaigns. Is backend running?</div>';

}

}

function renderGrid(list){

const grid=document.getElementById('grid');
grid.innerHTML='';

if(!Array.isArray(list)||list.length===0){

grid.innerHTML='<div class="col-12">No campaigns available.</div>';
return;

}

list.forEach(c=>{

const pct=c.goal_amount?Math.round((c.raised_amount/c.goal_amount)*100):0;

const col=document.createElement('div');
col.className='col-md-4';

col.innerHTML=`

<div class="card campaign-card" style="cursor:pointer;" onclick="openCampaignDetails(${c.id})">

<img src="${c.image||'https://picsum.photos/seed/1/800/400'}" class="campaign-img">

<div class="card-body">

<h5>${escapeHtml(c.title)}</h5>

<p class="small-muted">
${escapeHtml((c.description||'').slice(0,110))}...
</p>

<div class="mb-2">

<div class="progress" style="height:10px;">
<div class="progress-bar" style="width:${pct}%"></div>
</div>

</div>

<div class="d-flex justify-content-between align-items-center">

<small>₹${c.raised_amount} / ₹${c.goal_amount}</small>

<a href="/donate/" class="btn btn-cta btn-sm">Donate</a>

</div>

</div>

</div>

`;

grid.appendChild(col);

});

}

async function openCampaignDetails(campaignId){

try{

const res=await fetch(API_BASE+"campaigns/"+campaignId+"/");
const c=await res.json();

const html=`

<div class="modal fade" id="campaignModal">

<div class="modal-dialog modal-lg modal-dialog-centered">

<div class="modal-content">

<div class="modal-header">
<h5 class="modal-title">${escapeHtml(c.title)}</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<img src="${c.image}" class="img-fluid mb-3">

<p><b>Description:</b> ${escapeHtml(c.description)}</p>
<p><b>Goal:</b> ₹${c.goal_amount}</p>
<p><b>Raised:</b> ₹${c.raised_amount}</p>
<p><b>Progress:</b> ${c.progress}%</p>
<p><b>Created by:</b> ${c.creator.username}</p>

</div>

<div class="modal-footer">

<a href="/donate/" class="btn btn-cta">Donate</a>

<button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>

</div>

</div>
</div>
</div>

`;

document.getElementById('campaignModalContainer').innerHTML=html;

new bootstrap.Modal(document.getElementById('campaignModal')).show();

}
catch(err){
console.error(err);
}

}

function openCreate(){

if(!currentUser){
alert('Login required');
return;
}

alert('Create campaign modal can go here');

}

document.addEventListener('DOMContentLoaded',()=>{
setAuthUI();
loadCampaigns();
});

</script>

</body>
</html>
