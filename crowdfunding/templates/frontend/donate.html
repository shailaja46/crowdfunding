<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Donate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#f4f6f9;font-family:Arial,sans-serif;">
  <div style="background:#fff;padding:30px;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,0.1);max-width:400px;width:100%;text-align:center;">
    <h2 style="color:#27ae60;">Make a Donation</h2>
    <form onsubmit="return handleDonate(event)">
      <input type="text" id="donorName" placeholder="Your Name" required
        style="width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ccc;font-size:1rem;">
      <input type="number" id="donorAmount" placeholder="Amount (₹)" required min="1"
        style="width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ccc;font-size:1rem;">
      <button type="submit"
        style="width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;background:#27ae60;color:#fff;font-weight:bold;font-size:1rem;cursor:pointer;">
        Donate
      </button>
    </form>
    
  </div>

  <script>
  function handleDonate(e) {
    e.preventDefault();
    const name = document.getElementById("donorName").value;
    const amount = document.getElementById("donorAmount").value;
    alert(`🎉 Thank you, ${name}! Your donation of ₹${amount} has been recorded.`);
  
  }
  </script>
</body>
</html>
